[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verify-mcp"
version = "0.1.1"
description = "A small MCP server with read-only, keyless lookups for verification work"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "osint", "verification", "journalism", "wayback"]
dependencies = []

[project.urls]
Homepage = "https://github.com/Ghongha007/verify-mcp"
Issues = "https://github.com/Ghongha007/verify-mcp/issues"

[project.scripts]
verify-mcp = "verify_mcp.server:main"

[tool.setuptools]
packages = ["verify_mcp"]
